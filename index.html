<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#087f5b">
<title>Bus Nha Trang</title>
<style>
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#f3f6f5;color:#17211e}
header{background:#087f5b;color:white;padding:35px 18px 22px}
h1{margin:0}
main{padding:16px;max-width:700px;margin:auto}
.card{background:white;padding:16px;border-radius:18px;margin-bottom:14px}
label{display:block;margin:12px 0 5px;color:#65736e}
input,select{width:100%;box-sizing:border-box;padding:13px;border:1px solid #ccc;border-radius:12px;font-size:16px}
button{width:100%;padding:14px;margin-top:14px;border:0;border-radius:12px;background:#087f5b;color:white;font-weight:bold;font-size:16px}
.step{padding:12px 0;border-bottom:1px solid #eee}
small{color:#65736e}
</style>
</head>

<body>
<header>
<h1>🚌 Bus Nha Trang</h1>
<p>Tìm xe buýt nội thành</p>
</header>

<main>
<div class="card">
<label>📍 Đi từ</label>
<input id="from" value="Quinter Central, 84 Trần Phú, Nha Trang">

<label>🏁 Đi đến</label>
<input id="to" value="16A Lãn Ông, Nha Trang">

<label>Ưu tiên</label>
<select id="pref">
<option>🚶 Đi bộ ít nhất</option>
<option>🚌 Ít đổi tuyến nhất</option>
<option>⚡ Nhanh nhất</option>
</select>

<button onclick="findRoute()">TÌM ĐƯỜNG</button>
</div>

<div class="card" id="result">
<h3>🚌 Tuyến thử nghiệm: 04</h3>

<div class="step">
🚶 <b>Đi bộ đến trạm gần Trần Phú</b><br>
<small>Dữ liệu trạm đang được hoàn thiện</small>
</div>

<div class="step">
🚌 <b>Lên tuyến 04</b>
</div>

<div class="step">
🚏 <b>Xuống gần khu vực Lãn Ông</b>
</div>

<button onclick="maps()">🗺️ Mở điểm đến trên Google Maps</button>
</div>
</main>

<script>
function findRoute(){
 localStorage.setItem("from",document.getElementById("from").value);
 localStorage.setItem("to",document.getElementById("to").value);
 document.getElementById("result").scrollIntoView({behavior:"smooth"});
}

function maps(){
 let q=document.getElementById("to").value;
 window.open("https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(q));
}

let f=localStorage.getItem("from");
let t=localStorage.getItem("to");
if(f) document.getElementById("from").value=f;
if(t) document.getElementById("to").value=t;
</script>
</body>
</html>
