<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bus Nha Trang V4.2</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
background:#f3f6f5;
color:#17211e
}

header{
background:linear-gradient(135deg,#087f5b,#50a97f);
color:white;
padding:35px 18px 25px
}

h1{margin:0;font-size:30px}

.wrap{
max-width:800px;
margin:auto;
padding:16px
}

.card{
background:white;
border-radius:20px;
padding:17px;
margin-bottom:15px
}

label{
display:block;
color:#64716d;
margin:12px 0 6px
}

input,select{
width:100%;
padding:14px;
border:1px solid #cad5d0;
border-radius:14px;
font-size:16px
}

button{
width:100%;
padding:15px;
border:0;
border-radius:14px;
background:#087f5b;
color:white;
font-size:16px;
font-weight:bold;
margin-top:13px
}

.status{
margin-top:12px;
padding:11px;
border-radius:12px;
background:#edf8f4;
color:#086746
}

.hidden{display:none}

.tabs{
display:flex;
gap:8px;
overflow:auto
}

.tab{
min-width:115px;
background:#eef5f2;
color:#17211e;
border:1px solid #d4e0db
}

.tab.on{
background:#087f5b;
color:white
}

.map{
height:280px;
background:linear-gradient(120deg,#e5efeb 0 75%,#a8dff1 75%);
border-radius:16px;
position:relative;
overflow:hidden
}

.line{
position:absolute;
left:57%;
top:35px;
width:8px;
height:210px;
background:#087f5b;
transform:rotate(8deg);
border-radius:10px
}

.dot{
position:absolute;
width:30px;
height:30px;
border-radius:50%;
color:white;
display:flex;
align-items:center;
justify-content:center;
font-weight:bold
}

.start{
left:53%;
top:20px;
background:#1670bd
}

.stop1{
left:55%;
top:90px;
background:#087f5b
}

.stop2{
left:59%;
top:175px;
background:#087f5b
}

.end{
left:62%;
top:235px;
background:#d43838
}

.maplabel{
position:absolute;
left:17%;
background:white;
padding:5px 8px;
border-radius:7px;
font-size:11px
}

.la{top:22px}
.l1{top:92px}
.l2{top:177px}
.lb{top:237px}

.metrics{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:8px;
margin:12px 0
}

.metric{
background:#f2f7f5;
border-radius:11px;
padding:10px;
text-align:center
}

.metric b{
display:block;
color:#087f5b
}

.timeline{
border-left:4px solid #8dcfb6;
padding-left:18px;
margin:17px 0
}

.step{
margin-bottom:18px
}

.small{
color:#66736e;
font-size:13px
}

.schedule{
background:#f2faf7;
border-radius:14px;
padding:12px
}

.times{
display:flex;
gap:7px;
overflow:auto;
margin-top:8px
}

.time{
min-width:90px;
padding:9px;
background:white;
border:1px solid #b9dfd1;
border-radius:10px;
text-align:center
}

.time.next{
background:#087f5b;
color:white
}

.notice{
background:#fff5d7;
color:#745b08;
border-radius:14px;
padding:13px;
font-size:12px
}
</style>
</head>


<body>

<header>
<h1>🚌 Bus Nha Trang</h1>
<p>V4.2 · Hành trình xe buýt</p>

<div class="wrap">

</option>

<div

</div>


<div
id="result"

>

<div class="card">

id="tabs"

<div class="line"></div>

</div>

<div

</div>

<div
id="mapBoard"
class="maplabel l1"

</div>

<div
id="mapExit"

Trạm xuống

<div
id="mapTo"

</div>

</div>

</div>


<div
id="detail"

></div>

</div>


<div class="notice">

Giờ xe, khoảng cách và thời gian hiện là dữ liệu thử nghiệm.

</div>

</div>

function timDuong(){

selected="04";


get("result").style.display="block";


get("status").innerHTML=
"✅ Nút hoạt động. Đang hiển thị kết quả.";


hienThi();


setTimeout(function(){

get("result").scrollIntoView();

},100);


}catch(error){

alert(
"Lỗi V4.2: "
+error.message
);

get("status").innerHTML=
"❌ Lỗi: "
+error.message;

}

}

+"class='tab "

+"')\">"

+id
+"</b>"

+"<br>"

+r.minutes

+" m</small>"

+"</button>";

}


get("tabs").innerHTML=
html;
